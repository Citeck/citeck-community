services:
  app:
    expose:
      - 8686/tcp
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    hostname: ecos-ecom-app
    restart: always
    stop_grace_period: 1m
    image: nexus.citeck.ru/ecos-ecom:1.14.0
    ports:
      - 18022:18022/tcp
    environment:
      - SERVER_PORT=18022
    env_file:
      - ./environments/ecos-ecom-app.env
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/18022; printf "GET /management/health HTTP/1.0\r\nHost: x\r\n\r\n" >&3; grep -q ''"status":"UP"'' <&3'
      interval: 20s
      timeout: 20s
      retries: 36
    networks:
      - app_network

services:
  app:
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    hostname: ecos-gateway-app
    restart: always
    stop_grace_period: 1m
    image: nexus.citeck.ru/ecos-gateway:3.6.0
    expose:
      - 8085/tcp
    env_file:
      - ./environments/ecos-gateway-app.env
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/8085; printf "GET /management/health HTTP/1.0\r\nHost: x\r\n\r\n" >&3; grep -q ''"status":"UP"'' <&3'
      interval: 20s
      timeout: 20s
      retries: 36
    networks:
      - app_network

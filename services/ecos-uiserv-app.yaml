services:
  app:
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    hostname: ecos-uiserv-app
    restart: always
    stop_grace_period: 1m
    image: nexus.citeck.ru/ecos-uiserv:2.34.3
    ports:
      - 18030:18030/tcp
    environment:
      - SERVER_PORT=18030
    env_file:
      - ./environments/ecos-uiserv-app.env
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/18030; printf "GET /management/health HTTP/1.0\r\nHost: x\r\n\r\n" >&3; grep -q ''"status":"UP"'' <&3'
      interval: 20s
      timeout: 20s
      retries: 36
    networks:
      - app_network

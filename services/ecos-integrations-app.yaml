services:
  app:
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    hostname: ecos-integrations-app
    restart: always
    stop_grace_period: 1m
    image: nexus.citeck.ru/ecos-integrations:2.32.5
    ports:
      - 18032:18032/tcp
    environment:
      - SERVER_PORT=18032
    env_file:
      - ./environments/ecos-integrations-app.env
    volumes:
      - ./ecos-community-demo-data/ecos-integrations-app:/opt/export/
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/18032; printf "GET /management/health HTTP/1.0\r\nHost: x\r\n\r\n" >&3; grep -q ''"status":"UP"'' <&3'
      interval: 20s
      timeout: 20s
      retries: 36
    networks:
      - app_network

services:
  app:
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    hostname: ecos-history-app
    restart: always
    stop_grace_period: 1m
    image: nexus.citeck.ru/ecos-history:2.24.0
    ports:
      - 18024:18024/tcp
    environment:
      - SERVER_PORT=18024
    env_file:
      - ./environments/ecos-history-app.env
    volumes:
      - ./ecos-community-demo-data/ecos-history-app/source:/source
      - ./ecos-community-demo-data/ecos-history-app/errors:/errors
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/18024; printf "GET /management/health HTTP/1.0\r\nHost: x\r\n\r\n" >&3; grep -q ''"status":"UP"'' <&3'
      interval: 20s
      timeout: 20s
      retries: 36
    networks:
      - app_network
